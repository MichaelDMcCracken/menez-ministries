<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sermon Admin</title>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f8f9fb; color: #111; }
        .page { max-width: 900px; margin: 0 auto; padding: 32px; }
        h1 { margin-bottom: 12px; }
        .note { margin: 0 0 24px; color: #555; line-height: 1.6; }
        form, .panel { background: white; border: 1px solid #e1e4ea; border-radius: 16px; padding: 24px; box-shadow: 0 16px 40px rgba(18, 32, 60, 0.08); }
        .panel { margin-top: 24px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, select { width: 100%; padding: 12px 14px; margin-bottom: 18px; border: 1px solid #c7cbd6; border-radius: 10px; font-size: 1rem; font-family: inherit; background: #fff; box-sizing: border-box; }
        .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 18px; }
        .grid > div > label { margin-bottom: 6px; }
        .grid > div > select { margin-bottom: 0; }
        .action-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .book-list { margin-bottom: 24px; }
        .book-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 12px 14px; border: 1px solid #e1e4ea; border-radius: 12px; background: #fff; margin-bottom: 8px; }
        .book-header h3 { margin: 0; font-size: 1rem; }
        .book-header button { background: transparent; color: #1d4ed8; border: none; font-size: 0.95rem; cursor: pointer; padding: 0; }
        .book-content { margin-bottom: 18px; }
        .hidden { display: none; }
        .sermon-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid #e1e4ea; border-radius: 12px; margin-bottom: 10px; background: #f8fafc; }
        .sermon-title { font-weight: 600; }
        .sermon-meta { color: #555; font-size: .95rem; margin-top: 4px; }
        .sermon-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .sermon-actions button { background: #e5e7eb; color: #111; border-radius: 10px; padding: 8px 12px; border: none; cursor: pointer; }
        .sermon-actions button:hover { background: #d1d5db; }
        button { display: inline-flex; align-items: center; justify-content: center; padding: 12px 22px; border: none; border-radius: 10px; background: #1d4ed8; color: white; font-size: 1rem; cursor: pointer; transition: background 0.2s ease; }
        button:hover { background: #1e40af; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #publish-button { background: #047857; }
        #publish-button:hover { background: #065f46; }
        #cancel-edit { background: #6b7280; }
        #cancel-edit:hover { background: #4b5563; }
        .status { margin: 0 0 18px; padding: 16px; border-radius: 12px; font-weight: 600; display: none; }
        .status.success { background: #ecfdf5; color: #166534; border: 1px solid #a7f3d0; }
        .status.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .small-note { color: #475569; font-size: 0.92rem; margin-top: -12px; margin-bottom: 16px; }
        .pending-group { margin-top: 12px; }
        .pending-group h3 { margin: 0 0 8px; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="page">
        <h1>Sermon Admin</h1>
        <p class="note">Stage sermon updates in this browser, review pending changes, then publish everything in one GitHub commit through the server-side admin API.</p>

        <div id="status" class="status"></div>

        <form id="admin-form">
            <input id="editing-sermon-id" type="hidden">

            <label for="book">Bible book</label>
            <select id="book" name="book" required></select>

            <label for="subtitle">Book subtitle (optional)</label>
            <input id="subtitle" name="subtitle" placeholder="Optional subtitle for this book">

            <label for="title">Sermon title</label>
            <input id="title" name="title" required>

            <label>Bible passage</label>
            <label style="font-weight:500;">
                <input id="no-passage" type="checkbox" style="width:auto; margin-right:8px; margin-bottom:0;">
                No passage for this sermon
            </label>
            <div class="grid">
                <div>
                    <label for="start-chapter">Start chapter</label>
                    <select id="start-chapter" required></select>
                </div>
                <div>
                    <label for="start-verse">Start verse</label>
                    <select id="start-verse" required></select>
                </div>
                <div>
                    <label for="end-chapter">End chapter (optional)</label>
                    <select id="end-chapter"></select>
                </div>
                <div>
                    <label for="end-verse">End verse (optional)</label>
                    <select id="end-verse"></select>
                </div>
            </div>
            <div id="legacy-passage-wrap" class="small-note hidden">
                <label style="font-weight:500; margin-bottom:6px;">
                    <input id="keep-legacy-passage" type="checkbox" checked style="width:auto; margin-right:8px; margin-bottom:0;">
                    Keep existing passage text for this sermon (legacy format)
                </label>
                <div id="legacy-passage-text"></div>
            </div>

            <label for="date">Date</label>
            <input id="date" name="date" type="date" placeholder="YYYY-MM-DD">

            <label for="url">Audio URL</label>
            <input id="url" name="url" type="url" placeholder="https://..." required>

            <div class="action-row">
                <button type="submit">Stage Changes</button>
                <button type="button" id="cancel-edit" class="hidden">Cancel edit</button>
            </div>
        </form>

        <section id="pending-section" class="panel">
            <h2>Pending Changes</h2>
            <p class="small-note">These changes are staged locally and are not public yet.</p>
            <div id="pending-container">No pending changes.</div>
            <div class="action-row" style="margin-top: 16px;">
                <input id="commit-message" placeholder="Optional publish commit message">
                <button type="button" id="publish-button" disabled>Publish Changes</button>
            </div>
        </section>

        <section id="sermons-list" class="panel">
            <h2>Working Sermons</h2>
            <div id="sermons-container">Loading sermons…</div>
        </section>
    </div>

    <script>

14,17,15,11,15,15,10]},{"name":"Joel","slug":"joel","chapters":[20,27,5,21]},{"name":"Amos","slug":"amos","chapters":[15,16,15,13,27,14,17,14,15]},{"name":"Obadiah","slug":"obadiah","chapters":[21]},{"name":"Jonah","slug":"jonah","chapters":[16,11,10,11]},{"name":"Micah","slug":"micah","chapters":[16,13,12,14,14,16,20]},{"name":"Nahum","slug":"nahum","chapters":[14,14,19]},{"name":"Habakkuk","slug":"habakkuk","chapters":[17,20,19]},{"name":"Zephaniah","slug":"zephaniah","chapters":[18,15,20]},{"name":"Haggai","slug":"haggai","chapters":[15,23]},{"name":"Zechariah","slug":"zechariah","chapters":[17,17,10,14,11,15,14,23,17,12,17,14,9,21]},{"name":"Malachi","slug":"malachi","chapters":[14,17,24]},{"name":"Matthew","slug":"matthew","chapters":[25,23,17,25,48,34,29,34,38,42,30,50,58,36,39,28,27,35,30,34,46,46,39,51,46,75,66,20]},{"name":"Mark","slug":"mark","chapters":[45,28,35,41,43,56,37,38,50,52,33,44,37,72,47,20]},{"name":"Luke","slug":"luke","chapters":[80,52,38,44,39,49,50,56,62,42,54,59,35,35,32,31,37,43,48,47,38,71,56,53]},{"name":"John","slug":"john","chapters":[51,25,36,54,47,71,53,59,41,42,57,50,38,31,27,33,26,40,42,31,25]},{"name":"Acts","slug":"acts","chapters":[26,47,26,37,42,15,60,40,43,48,30,25,52,28,41,40,34,28,41,38,40,30,35,27,27,32,44,31]},{"name":"Romans","slug":"romans","chapters":[32,29,31,25,21,23,25,39,33,21,36,21,14,23,33,27]},{"name":"1 Corinthians","slug":"1-corinthians","chapters":[31,16,23,21,13,20,40,13,27,33,34,31,13,40,58,24]},{"name":"2 Corinthians","slug":"2-corinthians","chapters":[24,17,18,18,21,18,16,24,15,18,33,21,14]},{"name":"Galatians","slug":"galatians","chapters":[24,21,29,31,26,18]},{"name":"Ephesians","slug":"ephesians","chapters":[23,22,21,32,33,24]},{"name":"Philippians","slug":"philippians","chapters":[30,30,21,23]},{"name":"Colossians","slug":"colossians","chapters":[29,23,25,18]},{"name":"1 Thessalonians","slug":"1-thessalonians","chapters":[10,20,13,18,28]},{"name":"2 Thessalonians","slug":"2-thessalonians","chapters":[12,17,18]},{"name":"1 Timothy","slug":"1-timothy","chapters":[20,15,16,16,25,21]},{"name":"2 Timothy","slug":"2-timothy","chapters":[18,26,17,22]},{"name":"Titus","slug":"titus","chapters":[16,15,15]},{"name":"Philemon","slug":"philemon","chapters":[25]},{"name":"Hebrews","slug":"hebrews","chapters":[14,18,19,16,14,20,28,13,28,39,40,29,25]},{"name":"James","slug":"james","chapters":[27,26,18,17,20]},{"name":"1 Peter","slug":"1-peter","chapters":[25,25,22,19,14]},{"name":"2 Peter","slug":"2-peter","chapters":[21,22,18]},{"name":"1 John","slug":"1-john","chapters":[10,29,24,21,21]},{"name":"2 John","slug":"2-john","chapters":[13]},{"name":"3 John","slug":"3-john","chapters":[15]},{"name":"Jude","slug":"jude","chapters":[25]},{"name":"Revelation","slug":"revelation","chapters":[20,29,22,11,14,17,17,13,21,11,19,17,18,20,8,21,18,24,21,15,27,21]}];
        const STORAGE_KEY = 'sermon-admin-staged-data-v1';

        const form = document.getElementById('admin-form');
        const statusEl = document.getElementById('status');
        const bookSelect = document.getElementById('book');
        const startChapterSelect = document.getElementById('start-chapter');
        const startVerseSelect = document.getElementById('start-verse');
        const endChapterSelect = document.getElementById('end-chapter');
        const endVerseSelect = document.getElementById('end-verse');
        const subtitleInput = document.getElementById('subtitle');
        const titleInput = document.getElementById('title');
        const dateInput = document.getElementById('date');
        const urlInput = document.getElementById('url');
        const editingSermonIdInput = document.getElementById('editing-sermon-id');
        const cancelEditButton = document.getElementById('cancel-edit');
        const keepLegacyPassageCheckbox = document.getElementById('keep-legacy-passage');
        const noPassageCheckbox = document.getElementById('no-passage');
        const legacyPassageWrap = document.getElementById('legacy-passage-wrap');
        const legacyPassageText = document.getElementById('legacy-passage-text');
        const pendingContainer = document.getElementById('pending-container');
        const publishButton = document.getElementById('publish-button');
        const commitMessageInput = document.getElementById('commit-message');
        const sermonsContainer = document.getElementById('sermons-container');

        const BOOK_BY_SLUG = Object.fromEntries(BIBLE_BOOKS.map(book => [book.slug, book]));
        let publishedData = {};
        let workingData = {};
        let pendingChanges = { added: [], edited: [], deleted: [], subtitleUpdated: [] };
        let nextId = 1;
        let legacyPassageValue = '';

        function deepClone(value) {
            return JSON.parse(JSON.stringify(value));
        }

        function escapeHtml(text) {
            return String(text || '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
        }

        function showStatus(message, type = 'success') {
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
            statusEl.style.display = 'block';
            statusEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function hideStatus() {
            statusEl.style.display = 'none';
        }

        function parsePassageReference(passage) {
            if (!passage || typeof passage !== 'string') return { chapter: Infinity, verse: Infinity };
            const firstMatch = passage.match(/(\d+)(?::(\d+))?/);
            if (!firstMatch) return { chapter: Infinity, verse: Infinity };
            return { chapter: Number(firstMatch[1]), verse: firstMatch[2] ? Number(firstMatch[2]) : 1 };
        }

        function sortSermonsByReference(sermons) {
            return [...(Array.isArray(sermons) ? sermons : [])].sort((a, b) => {
                const refA = parsePassageReference(a.passage);
                const refB = parsePassageReference(b.passage);
                if (refA.chapter !== refB.chapter) return refA.chapter - refB.chapter;
                return refA.verse - refB.verse;
            });
        }

        function normalizeBookName(name) {
            return String(name || '').toLowerCase().replace(/\s+/g, ' ').trim().replace(/^psalm$/, 'psalms');
        }

        function ensureIds(data) {
            const cloned = deepClone(data || {});
            for (const book of Object.keys(cloned)) {
                const sermons = Array.isArray(cloned[book]?.sermons) ? cloned[book].sermons : [];
                cloned[book].sermons = sermons.map(sermon => {
                    if (sermon && sermon._id) {
                        const match = String(sermon._id).match(/^s(\d+)$/);
                        if (match) nextId = Math.max(nextId, Number(match[1]) + 1);
                        return sermon;
                    }
                    return { ...sermon, _id: `s${nextId++}` };
                });
            }
            return cloned;
        }

        function sanitizeForPublish(data) {
            const next = {};
            for (const [book, bookData] of Object.entries(data || {})) {
                const sermons = Array.isArray(bookData?.sermons) ? bookData.sermons : [];
                next[book] = {
                    ...(bookData?.subtitle ? { subtitle: String(bookData.subtitle).trim() } : {}),
                    sermons: sermons.map(sermon => {
                        const entry = { title: String(sermon.title || '').trim(), url: String(sermon.url || '').trim() };
                        if (sermon.passage) entry.passage = String(sermon.passage).trim();
                        if (sermon.date) entry.date = String(sermon.date).trim();
                        return entry;
                    })
                };
            }
            return next;
        }

        function stableCloneForSignature(value) {
            if (Array.isArray(value)) {
                return value.map(stableCloneForSignature);
            }
            if (!value || typeof value !== 'object') {
                return value;
            }

            return Object.keys(value).sort().reduce((result, key) => {
                result[key] = stableCloneForSignature(value[key]);
                return result;
            }, {});
        }

        function createDatasetSignature(data) {
            return JSON.stringify(stableCloneForSignature(sanitizeForPublish(data)));
        }

        function saveStagedState() {
            if (!pendingChanges.added.length && !pendingChanges.edited.length && !pendingChanges.deleted.length && !pendingChanges.subtitleUpdated.length) {
                localStorage.removeItem(STORAGE_KEY);
                return;
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                workingData,
                baseSignature: createDatasetSignature(publishedData),
            }));
        }

        function loadStagedState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object' || !parsed.workingData || typeof parsed.workingData !== 'object') return null;
                return {
                    workingData: parsed.workingData,
                    baseSignature: typeof parsed.baseSignature === 'string' ? parsed.baseSignature : '',
                };
            } catch (error) {
                return null;
            }
        }

        function renderBookOptions(selectedBook) {
            const known = new Set(BIBLE_BOOKS.map(book => book.slug));
            const extraSlugs = Object.keys(workingData).filter(slug => !known.has(slug)).sort();
            const options = [
                ...BIBLE_BOOKS.map(book => `<option value="${book.slug}">${escapeHtml(book.name)}</option>`),
                ...extraSlugs.map(slug => `<option value="${escapeHtml(slug)}">${escapeHtml(slug.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join(' '))}</option>`)
            ];
            bookSelect.innerHTML = options.join('');
            if (selectedBook && options.length) {
                bookSelect.value = selectedBook;
            }
        }

        function getSelectedBookMeta() {
            return BOOK_BY_SLUG[bookSelect.value] || null;
        }

        function renderChapterOptions() {
            const book = getSelectedBookMeta();
            const chapters = Array.isArray(book?.chapters) ? book.chapters : [];
            startChapterSelect.innerHTML = chapters.map((_, index) => `<option value="${index + 1}">Chapter ${index + 1}</option>`).join('');
            if (!chapters.length) {
                startChapterSelect.innerHTML = '<option value="">N/A</option>';
                startVerseSelect.innerHTML = '<option value="">N/A</option>';
                endChapterSelect.innerHTML = '<option value="">None</option>';
                endVerseSelect.innerHTML = '<option value="">None</option>';
                startChapterSelect.disabled = true;
                startVerseSelect.disabled = true;
                endChapterSelect.disabled = true;
                endVerseSelect.disabled = true;
                return;
            }
            startChapterSelect.disabled = false;
            startVerseSelect.disabled = false;
            endChapterSelect.disabled = false;
            updateStartVerseOptions();
            updateEndChapterOptions();
        }

        function updateStartVerseOptions() {
            const book = getSelectedBookMeta();
            const chapter = Number(startChapterSelect.value || '1');
            const versesInChapter = book?.chapters?.[chapter - 1] || 1;
            const previous = Number(startVerseSelect.value || '1');
            startVerseSelect.innerHTML = Array.from({ length: versesInChapter }, (_, i) => `<option value="${i + 1}">Verse ${i + 1}</option>`).join('');
            startVerseSelect.value = String(Math.min(previous, versesInChapter));
            updateEndChapterOptions();
        }

        function updateEndChapterOptions() {
            const book = getSelectedBookMeta();
            const startChapter = Number(startChapterSelect.value || '1');
            const previous = endChapterSelect.value;
            const chapters = Array.isArray(book?.chapters) ? book.chapters : [];
            const options = ['<option value="">None</option>'];
            for (let chapter = startChapter; chapter <= chapters.length; chapter += 1) {
                options.push(`<option value="${chapter}">Chapter ${chapter}</option>`);
            }
            endChapterSelect.innerHTML = options.join('');
            if (previous && Number(previous) >= startChapter && Number(previous) <= chapters.length) {
                endChapterSelect.value = previous;
            }
            updateEndVerseOptions();
        }

        function updateEndVerseOptions() {
            const book = getSelectedBookMeta();
            const endChapter = Number(endChapterSelect.value || '0');
            if (!endChapter || !book) {
                endVerseSelect.innerHTML = '<option value="">None</option>';
                endVerseSelect.value = '';
                endVerseSelect.disabled = true;
                return;
            }

            const startChapter = Number(startChapterSelect.value || '1');
            const startVerse = Number(startVerseSelect.value || '1');
            const minVerse = endChapter === startChapter ? startVerse : 1;
            const versesInChapter = book.chapters[endChapter - 1] || minVerse;
            const previous = Number(endVerseSelect.value || minVerse);
            endVerseSelect.innerHTML = ['<option value="">Select verse</option>', ...Array.from({ length: Math.max(versesInChapter - minVerse + 1, 0) }, (_, i) => {
                const verse = minVerse + i;
                return `<option value="${verse}">Verse ${verse}</option>`;
            })].join('');
            endVerseSelect.disabled = false;
            if (previous >= minVerse && previous <= versesInChapter) {
                endVerseSelect.value = String(previous);
            } else {
                endVerseSelect.value = '';
            }
        }

        function updatePassageInputAvailability() {
            const hasBookMetadata = Boolean(getSelectedBookMeta());
            const disableSelectors = noPassageCheckbox.checked || (legacyPassageValue && keepLegacyPassageCheckbox.checked);
            startChapterSelect.disabled = disableSelectors || !hasBookMetadata;
            startVerseSelect.disabled = disableSelectors || !hasBookMetadata;
            endChapterSelect.disabled = disableSelectors || !hasBookMetadata;
            endVerseSelect.disabled = disableSelectors || !hasBookMetadata || !endChapterSelect.value;
        }

        function resetForm() {
            form.reset();
            editingSermonIdInput.value = '';
            legacyPassageValue = '';
            keepLegacyPassageCheckbox.checked = true;
            noPassageCheckbox.checked = false;
            legacyPassageWrap.classList.add('hidden');
            cancelEditButton.classList.add('hidden');
            renderBookOptions(bookSelect.value || 'genesis');
            if (!bookSelect.value) bookSelect.value = 'genesis';
            renderChapterOptions();
            updatePassageInputAvailability();
            commitMessageInput.value = '';
        }

        function getBookDisplayName(slug) {
            return BOOK_BY_SLUG[slug]?.name || slug.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join(' ');
        }

        function cleanupBookIfEmpty(book) {
            const bookData = workingData[book];
            if (!bookData) return;
            const hasSubtitle = Boolean((bookData.subtitle || '').trim());
            const sermonCount = Array.isArray(bookData.sermons) ? bookData.sermons.length : 0;
            if (!sermonCount && !hasSubtitle) {
                delete workingData[book];
            }
        }

        function resolveStagedState(stagedState, publishedSignature) {
            if (!stagedState) return { action: 'none' };
            if (stagedState.baseSignature === publishedSignature) {
                return { action: 'restore', workingData: stagedState.workingData };
            }
            return { action: 'discard' };
        }

        function parseExistingPassage(bookSlug, passage) {
            const text = String(passage || '').trim();
            if (!text) return null;
            const match = text.match(/^(.+?)\s+(\d+):(\d+)(?:[–-](?:(\d+):)?(\d+))?$/);
            if (!match) return null;
            const [, rawBook, startChapterText, startVerseText, endChapterText, endVerseText] = match;
            if (normalizeBookName(rawBook) !== normalizeBookName(getBookDisplayName(bookSlug))) return null;

            const startChapter = Number(startChapterText);
            const startVerse = Number(startVerseText);
            const endChapter = endChapterText ? Number(endChapterText) : (endVerseText ? startChapter : null);
            const endVerse = endVerseText ? Number(endVerseText) : null;

            const meta = BOOK_BY_SLUG[bookSlug];
            if (!meta) return null;
            const startMax = meta.chapters[startChapter - 1];
            if (!startMax || startVerse < 1 || startVerse > startMax) return null;
            if (endChapter !== null && endVerse !== null) {
                const endMax = meta.chapters[endChapter - 1];
                if (!endMax || endVerse < 1 || endVerse > endMax) return null;
                if (endChapter < startChapter || (endChapter === startChapter && endVerse < startVerse)) return null;
            }

            return { startChapter, startVerse, endChapter, endVerse };
        }

        function formatPassageFromSelection() {
            if (legacyPassageValue && keepLegacyPassageCheckbox.checked) {
                return legacyPassageValue;
            }

            if (noPassageCheckbox.checked) {
                return '';
            }

            const meta = getSelectedBookMeta();
            if (!meta) return '';
            const startChapter = Number(startChapterSelect.value || '0');
            const startVerse = Number(startVerseSelect.value || '0');
            if (!startChapter || !startVerse) {
                throw new Error('Choose a start chapter and verse.');
            }

            const endChapterValue = endChapterSelect.value;
            const endVerseValue = endVerseSelect.value;
            if (!endChapterValue) {
                return `${meta.name} ${startChapter}:${startVerse}`;
            }

            if (!endVerseValue) {
                throw new Error('Choose an end verse or clear the end chapter.');
            }

            const endChapter = Number(endChapterValue);
            const endVerse = Number(endVerseValue);
            if (endChapter < startChapter || (endChapter === startChapter && endVerse < startVerse)) {
                throw new Error('End reference must come after the start reference.');
            }

            if (endChapter === startChapter) {
                return `${meta.name} ${startChapter}:${startVerse}–${endVerse}`;
            }

            return `${meta.name} ${startChapter}:${startVerse}–${endChapter}:${endVerse}`;
        }

        function renderSermonList() {
            const books = Object.keys(workingData).sort();
            if (!books.length) {
                sermonsContainer.textContent = 'No sermons yet.';
                return;
            }

            sermonsContainer.innerHTML = books.map(book => {
                const bookData = workingData[book];
                const sermons = sortSermonsByReference(bookData.sermons || []);
                const subtitleHtml = bookData.subtitle ? `<div class="sermon-meta">${escapeHtml(bookData.subtitle)}</div>` : '';
                const sermonsHtml = sermons.map(sermon => {
                    const meta = [sermon.date, sermon.passage].filter(Boolean).map(escapeHtml).join(' • ');
                    return `
                        <div class="sermon-row">
                            <div class="sermon-info">
                                <div class="sermon-title">${escapeHtml(sermon.title)}</div>
                                <div class="sermon-meta">${meta}</div>
                            </div>
                            <div class="sermon-actions">
                                <button type="button" data-action="edit" data-sermon-id="${escapeHtml(sermon._id)}">Edit</button>
                                <button type="button" data-action="delete" data-sermon-id="${escapeHtml(sermon._id)}">Delete</button>
                            </div>
                        </div>`;
                }).join('');

                return `
                    <div class="book-list">
                        <div class="book-header">
                            <h3>${escapeHtml(getBookDisplayName(book))}</h3>
                            <button type="button" aria-expanded="false">Expand</button>
                        </div>
                        <div class="book-content hidden">
                            ${subtitleHtml}
                            ${sermonsHtml}
                        </div>
                    </div>`;
            }).join('');
        }

        function buildSermonMap(data) {
            const map = new Map();
            for (const [book, bookData] of Object.entries(data || {})) {
                for (const sermon of (bookData.sermons || [])) {
                    map.set(sermon._id, { book, sermon });
                }
            }
            return map;
        }

        function computePendingChanges() {
            const baseMap = buildSermonMap(publishedData);
            const currentMap = buildSermonMap(workingData);
            const added = [];
            const edited = [];
            const deleted = [];

            for (const [id, current] of currentMap.entries()) {
                const original = baseMap.get(id);
                if (!original) {
                    added.push({ title: current.sermon.title, book: current.book });
                    continue;
                }

                if (
                    original.book !== current.book ||
                    original.sermon.title !== current.sermon.title ||
                    original.sermon.url !== current.sermon.url ||
                    (original.sermon.date || '') !== (current.sermon.date || '') ||
                    (original.sermon.passage || '') !== (current.sermon.passage || '')
                ) {
                    edited.push({ title: current.sermon.title, book: current.book });
                }
            }

            for (const [id, original] of baseMap.entries()) {
                if (!currentMap.has(id)) {
                    deleted.push({ title: original.sermon.title, book: original.book });
                }
            }

            const subtitleUpdated = [];
            const bookSet = new Set([...Object.keys(publishedData), ...Object.keys(workingData)]);
            for (const book of bookSet) {
                const before = (publishedData[book]?.subtitle || '').trim();
                const after = (workingData[book]?.subtitle || '').trim();
                if (before !== after) {
                    subtitleUpdated.push({ book });
                }
            }

            pendingChanges = { added, edited, deleted, subtitleUpdated };
            saveStagedState();
        }

        function renderPendingChanges() {
            const { added, edited, deleted, subtitleUpdated } = pendingChanges;
            if (!added.length && !edited.length && !deleted.length && !subtitleUpdated.length) {
                pendingContainer.textContent = 'No pending changes.';
                publishButton.disabled = true;
                return;
            }

            publishButton.disabled = false;
            pendingContainer.innerHTML = `
                ${added.length ? `<div class="pending-group"><h3>Added</h3>${added.map(item => `<div>• Added: “${escapeHtml(item.title)}” (${escapeHtml(getBookDisplayName(item.book))})</div>`).join('')}</div>` : ''}
                ${edited.length ? `<div class="pending-group"><h3>Edited</h3>${edited.map(item => `<div>• Edited: “${escapeHtml(item.title)}” (${escapeHtml(getBookDisplayName(item.book))})</div>`).join('')}</div>` : ''}
                ${deleted.length ? `<div class="pending-group"><h3>Deleted</h3>${deleted.map(item => `<div>• Deleted: “${escapeHtml(item.title)}” (${escapeHtml(getBookDisplayName(item.book))})</div>`).join('')}</div>` : ''}
                ${subtitleUpdated.length ? `<div class="pending-group"><h3>Book metadata</h3>${subtitleUpdated.map(item => `<div>• Updated subtitle: ${escapeHtml(getBookDisplayName(item.book))}</div>`).join('')}</div>` : ''}
            `;
        }

        function rerender() {
            renderBookOptions(bookSelect.value || 'genesis');
            renderSermonList();
            computePendingChanges();
            renderPendingChanges();
        }

        function findSermonById(id) {
            for (const [book, bookData] of Object.entries(workingData)) {
                const index = (bookData.sermons || []).findIndex(sermon => sermon._id === id);
                if (index >= 0) return { book, index, sermon: bookData.sermons[index] };
            }
            return null;
        }

        function startEdit(sermonId) {
            const found = findSermonById(sermonId);
            if (!found) {
                showStatus('Unable to load sermon for editing.', 'error');
                return;
            }

            const { book, sermon } = found;
            editingSermonIdInput.value = sermon._id;
            bookSelect.value = book;
            subtitleInput.value = workingData[book]?.subtitle || '';
            titleInput.value = sermon.title || '';
            dateInput.value = sermon.date || '';
            urlInput.value = sermon.url || '';
            cancelEditButton.classList.remove('hidden');

            renderChapterOptions();
            const parsedPassage = parseExistingPassage(book, sermon.passage || '');
            legacyPassageValue = '';
            legacyPassageWrap.classList.add('hidden');
            noPassageCheckbox.checked = false;

            if (parsedPassage) {
                startChapterSelect.value = String(parsedPassage.startChapter);
                updateStartVerseOptions();
                startVerseSelect.value = String(parsedPassage.startVerse);
                updateEndChapterOptions();
                if (parsedPassage.endChapter && parsedPassage.endVerse) {
                    endChapterSelect.value = String(parsedPassage.endChapter);
                    updateEndVerseOptions();
                    endVerseSelect.value = String(parsedPassage.endVerse);
                } else {
                    endChapterSelect.value = '';
                    updateEndVerseOptions();
                }
            } else if (sermon.passage) {
                legacyPassageValue = sermon.passage;
                keepLegacyPassageCheckbox.checked = true;
                legacyPassageText.textContent = `Existing passage: ${sermon.passage}`;
                legacyPassageWrap.classList.remove('hidden');
            } else {
                noPassageCheckbox.checked = true;
            }
            updatePassageInputAvailability();

            showStatus(`Editing sermon from ${getBookDisplayName(book)}. Stage Changes to save locally.`, 'success');
        }

        function stageDelete(sermonId) {
            const found = findSermonById(sermonId);
            if (!found) {
                showStatus('Unable to find sermon to delete.', 'error');
                return;
            }
            if (!confirm('Stage deletion for this sermon?')) return;

            const { book, index } = found;
            workingData[book].sermons.splice(index, 1);
            cleanupBookIfEmpty(book);

            if (editingSermonIdInput.value === sermonId) {
                resetForm();
            }

            rerender();
            showStatus('Deletion staged locally. Publish Changes to make it public.', 'success');
        }

        function ensureBook(workingBook) {
            if (!workingData[workingBook]) {
                workingData[workingBook] = { sermons: [] };
            }
        }

        function stageFormChanges() {
            const book = bookSelect.value;
            const title = titleInput.value.trim();
            const url = urlInput.value.trim();
            if (!book || !title || !url) {
                showStatus('Bible book, sermon title, and URL are required.', 'error');
                return;
            }

            let passage = '';
            try {
                passage = formatPassageFromSelection();
            } catch (error) {
                showStatus(error.message, 'error');
                return;
            }

            const editingId = editingSermonIdInput.value || '';
            if (editingId) {
                const found = findSermonById(editingId);
                if (found) {
                    workingData[found.book].sermons.splice(found.index, 1);
                    cleanupBookIfEmpty(found.book);
                }
            }

            ensureBook(book);
            const subtitle = subtitleInput.value.trim();
            if (subtitle) {
                workingData[book].subtitle = subtitle;
            } else {
                delete workingData[book].subtitle;
            }

            const sermon = { _id: editingId || `s${nextId++}`, title, url };
            const date = dateInput.value.trim();
            if (date) sermon.date = date;
            if (passage) sermon.passage = passage;
            workingData[book].sermons.push(sermon);
            workingData[book].sermons = sortSermonsByReference(workingData[book].sermons);

            resetForm();
            rerender();
            showStatus('Changes staged locally. Publish Changes to update GitHub.', 'success');
        }

        async function publishChanges() {
            if (publishButton.disabled) return;
            hideStatus();
            showStatus('Publishing staged changes...', 'success');
            publishButton.disabled = true;

            try {
                const response = await fetch('/api/publish-changes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: sanitizeForPublish(workingData), commitMessage: commitMessageInput.value.trim() })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Publish failed');

                localStorage.removeItem(STORAGE_KEY);
                await loadData();
                showStatus(result.message || 'Staged changes published successfully.', 'success');
            } catch (error) {
                showStatus(error.message, 'error');
                computePendingChanges();
                renderPendingChanges();
            } finally {
                publishButton.disabled = false;
            }
        }

        async function loadData() {
            const response = await fetch('/api/data');
            if (!response.ok) throw new Error('Unable to load sermon data');
            const data = await response.json();
            nextId = 1;
            publishedData = ensureIds(data);

            const staged = loadStagedState();
            const stagedResolution = resolveStagedState(staged, createDatasetSignature(publishedData));
            if (stagedResolution.action === 'restore') {
                workingData = ensureIds(stagedResolution.workingData);
                showStatus('Restored unpublished staged changes from this browser.', 'success');
            } else if (stagedResolution.action === 'discard') {
                localStorage.removeItem(STORAGE_KEY);
                workingData = deepClone(publishedData);
                showStatus('Discarded outdated staged changes because published sermons changed.', 'error');
            } else {
                workingData = deepClone(publishedData);
            }

            resetForm();
            rerender();
        }

        form.addEventListener('submit', event => {
            event.preventDefault();
            hideStatus();
            stageFormChanges();
        });

        cancelEditButton.addEventListener('click', event => {
            event.preventDefault();
            hideStatus();
            resetForm();
        });

        bookSelect.addEventListener('change', () => {
            renderChapterOptions();
            updatePassageInputAvailability();
        });
        startChapterSelect.addEventListener('change', updateStartVerseOptions);
        startVerseSelect.addEventListener('change', updateEndVerseOptions);
        endChapterSelect.addEventListener('change', updateEndVerseOptions);
        noPassageCheckbox.addEventListener('change', updatePassageInputAvailability);
        keepLegacyPassageCheckbox.addEventListener('change', updatePassageInputAvailability);
        publishButton.addEventListener('click', publishChanges);

        sermonsContainer.addEventListener('click', event => {
            const header = event.target.closest('.book-header');
            if (header) {
                const content = header.nextElementSibling;
                if (!content) return;
                const expandedButton = header.querySelector('button');
                content.classList.toggle('hidden');
                if (expandedButton) {
                    const isHidden = content.classList.contains('hidden');
                    expandedButton.textContent = isHidden ? 'Expand' : 'Collapse';
                    expandedButton.setAttribute('aria-expanded', String(!isHidden));
                }
                return;
            }

            const button = event.target.closest('button[data-action]');
            if (!button) return;
            const sermonId = button.dataset.sermonId;
            if (button.dataset.action === 'edit') {
                startEdit(sermonId);
            } else if (button.dataset.action === 'delete') {
                stageDelete(sermonId);
            }
        });

        window.addEventListener('beforeunload', event => {
            if (!pendingChanges.added.length && !pendingChanges.edited.length && !pendingChanges.deleted.length && !pendingChanges.subtitleUpdated.length) return;
            event.preventDefault();
            event.returnValue = '';
        });

        window.__SERMON_ADMIN_TEST_HOOKS__ = {
            resolveStagedState,
        };

        if (!window.__SERMON_ADMIN_DISABLE_AUTOLOAD__) {
            loadData().catch(error => showStatus(error.message, 'error'));
        }
    </script>
</body>
</html>
