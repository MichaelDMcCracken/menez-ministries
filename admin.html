<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sermon Admin</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            background: #f8f9fb;
            color: #111;
        }
        .page {
            max-width: 760px;
            margin: 0 auto;
            padding: 32px;
        }
        h1 { margin-bottom: 12px; }
        .note { margin: 0 0 24px; color: #555; line-height: 1.6; }
        form {
            background: white;
            border: 1px solid #e1e4ea;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 16px 40px rgba(18,32,60,.08);
        }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, select {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 18px;
            border: 1px solid #c7cbd6;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            background: #fff;
            box-sizing: border-box;
        }
        .book-list { margin-bottom: 24px; }
        .sermon-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border: 1px solid #e1e4ea;
            border-radius: 12px;
            margin-bottom: 10px;
            background: #f8fafc;
        }
        .sermon-info { min-width: 0; }
        .sermon-title { font-weight: 600; }
        .sermon-meta { color: #555; font-size: .95rem; margin-top: 4px; }
        .sermon-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .sermon-actions button {
            background: #e5e7eb;
            color: #111;
            border-radius: 10px;
            padding: 8px 12px;
            border: none;
            cursor: pointer;
        }
        .sermon-actions button:hover { background: #d1d5db; }
        .book-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 12px 14px;
            border: 1px solid #e1e4ea;
            border-radius: 12px;
            background: #fff;
            margin-bottom: 8px;
        }
        .book-header h3 { margin: 0; font-size: 1rem; }
        .book-header button {
            background: transparent;
            color: #1d4ed8;
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            padding: 0;
        }
        .book-content { margin-bottom: 18px; }
        .hidden { display: none; }
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 22px;
            border: none;
            border-radius: 10px;
            background: #1d4ed8;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: #1e40af; }
        .status {
            margin-top: 18px;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            display: none;
        }
        .status.success { background: #ecfdf5; color: #166534; border: 1px solid #a7f3d0; }
        .status.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        #login-section  { max-width: 400px; margin: 80px auto; }
        #app-section    { display: none; }
        .sign-out-btn {
            float: right;
            background: #6b7280;
            padding: 8px 16px;
            font-size: 0.9rem;
        }
        .sign-out-btn:hover { background: #4b5563; }
    </style>
</head>
<body>

<!-- ── Login ── -->
<div class="page" id="login-section">
    <h1>Sermon Admin</h1>
    <p class="note">Sign in with your Supabase admin account to manage sermons.</p>
    <div id="login-status" class="status"></div>
    <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="username">
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password">
        <button type="submit">Sign in</button>
    </form>
</div>

<!-- ── App ── -->
<div class="page" id="app-section">
    <button class="sign-out-btn" id="sign-out-btn" type="button">Sign out</button>
    <h1>Sermon Admin</h1>
    <p class="note">Add, edit, or delete sermons. Changes are saved instantly to Supabase and reflected live on the public site.</p>

    <div id="status" class="status"></div>

    <form id="admin-form">
        <label for="book">Book slug</label>
        <select id="book" name="book" required>
            <option value="" disabled selected>Select a book</option>
            <option value="__new__">Add a new book slug…</option>
        </select>
        <input id="new-book" name="newBook" placeholder="New book slug (e.g. galatians)" style="display:none">
        <input id="sermon-id" name="sermonId" type="hidden">

        <label for="subtitle">Book subtitle (optional)</label>
        <input id="subtitle" name="subtitle" placeholder="Optional series subtitle">

        <label for="title">Sermon title</label>
        <input id="title" name="title" required>

        <label for="passage">Passage</label>
        <input id="passage" name="passage" placeholder="e.g. 1 Corinthians 2:1–5">

        <label for="date">Date</label>
        <input id="date" name="date" type="date">

        <label for="url">Audio / Video URL</label>
        <input id="url" name="url" type="url" placeholder="https://…" required>

        <button type="submit">Save sermon</button>
        <button type="button" id="cancel-edit" style="margin-left:12px; background:#6b7280; display:none;">Cancel edit</button>
    </form>

    <section id="sermons-list" style="margin-top:32px;">
        <h2>Existing sermons</h2>
        <div id="sermons-container">Loading sermons…</div>
    </section>
</div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ── DOM refs ──────────────────────────────────────────────────────────────
    const loginSection    = document.getElementById('login-section');
    const appSection      = document.getElementById('app-section');
    const loginForm       = document.getElementById('login-form');
    const loginStatus     = document.getElementById('login-status');
    const signOutBtn      = document.getElementById('sign-out-btn');
    const adminForm       = document.getElementById('admin-form');
    const statusEl        = document.getElementById('status');
    const bookSelect      = document.getElementById('book');
    const newBookInput    = document.getElementById('new-book');
    const sermonIdInput   = document.getElementById('sermon-id');
    const cancelEditBtn   = document.getElementById('cancel-edit');
    const sermonsContainer = document.getElementById('sermons-container');

    // ── Helpers ───────────────────────────────────────────────────────────────
    function showStatus(msg, type = 'success') {
        statusEl.textContent = msg;
        statusEl.className   = 'status ' + type;
        statusEl.style.display = 'block';
        statusEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    function hideStatus() { statusEl.style.display = 'none'; }

    function showLoginStatus(msg, type = 'error') {
        loginStatus.textContent = msg;
        loginStatus.className   = 'status ' + type;
        loginStatus.style.display = 'block';
    }

    function formatBookTitle(slug) {
        return slug.split('-').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
    }

    function escapeHtml(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function parsePassageRef(passage) {
        if (!passage) return { chapter: Infinity, verse: Infinity };
        const m = passage.match(/(\d+)(?::(\d+))?/);
        if (!m) return { chapter: Infinity, verse: Infinity };
        return { chapter: Number(m[1]), verse: m[2] ? Number(m[2]) : 1 };
    }

    function sortSermons(sermons) {
        return [...sermons].sort((a, b) => {
            const ra = parsePassageRef(a.passage);
            const rb = parsePassageRef(b.passage);
            if (ra.chapter !== rb.chapter) return ra.chapter - rb.chapter;
            return ra.verse - rb.verse;
        });
    }

    function updateBookInputVisibility() {
        const isNew = bookSelect.value === '__new__';
        newBookInput.style.display = isNew ? 'block' : 'none';
        if (!isNew) newBookInput.value = '';
    }

    function resetForm() {
        adminForm.reset();
        sermonIdInput.value = '';
        cancelEditBtn.style.display = 'none';
        updateBookInputVisibility();
    }

    // ── Auth ──────────────────────────────────────────────────────────────────
    async function checkSession() {
        const { data: { session } } = await db.auth.getSession();
        if (session) {
            showApp();
        }
    }

    function showApp() {
        loginSection.style.display = 'none';
        appSection.style.display   = 'block';
        loadSermons();
    }

    function showLogin() {
        appSection.style.display   = 'none';
        loginSection.style.display = 'block';
    }

    loginForm.addEventListener('submit', async e => {
        e.preventDefault();
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) {
            showLoginStatus(error.message);
        } else {
            loginStatus.style.display = 'none';
            showApp();
        }
    });

    signOutBtn.addEventListener('click', async () => {
        await db.auth.signOut();
        showLogin();
    });

    db.auth.onAuthStateChange((event) => {
        if (event === 'SIGNED_OUT') showLogin();
    });

    // ── Load sermons ──────────────────────────────────────────────────────────
    async function loadSermons() {
        const { data: rows, error } = await db
            .from('sermons')
            .select('id, book_slug, book_subtitle, passage, title, url, date')
            .order('book_slug', { ascending: true })
            .order('id',        { ascending: true });

        if (error) {
            showStatus('Failed to load sermons: ' + error.message, 'error');
            return;
        }

        // Group by book_slug
        const grouped = {};
        for (const row of rows) {
            if (!grouped[row.book_slug]) grouped[row.book_slug] = { subtitle: row.book_subtitle, sermons: [] };
            grouped[row.book_slug].sermons.push(row);
        }

        // Populate book dropdown
        const slugs = Object.keys(grouped).sort();
        bookSelect.innerHTML =
            '<option value="" disabled selected>Select a book</option>' +
            '<option value="__new__">Add a new book slug…</option>' +
            slugs.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(formatBookTitle(s))}</option>`).join('');
        updateBookInputVisibility();

        // Render sermon list
        if (!slugs.length) {
            sermonsContainer.textContent = 'No sermons yet.';
            return;
        }

        sermonsContainer.innerHTML = slugs.map(book => {
            const bookData = grouped[book];
            const bookTitle = formatBookTitle(book);
            const subtitleHtml = bookData.subtitle ? `<div class="sermon-meta">${escapeHtml(bookData.subtitle)}</div>` : '';
            const sorted = sortSermons(bookData.sermons);
            const sermonsHtml = sorted.map(sermon => {
                const meta = [sermon.date, sermon.passage].filter(Boolean).join(' • ');
                return `
                    <div class="sermon-row">
                        <div class="sermon-info">
                            <div class="sermon-title">${escapeHtml(sermon.title)}</div>
                            <div class="sermon-meta">${escapeHtml(meta)}</div>
                        </div>
                        <div class="sermon-actions">
                            <button type="button" data-action="edit"   data-id="${sermon.id}">Edit</button>
                            <button type="button" data-action="delete" data-id="${sermon.id}">Delete</button>
                        </div>
                    </div>`;
            }).join('');

            return `
                <div class="book-list">
                    <div class="book-header" data-book="${escapeHtml(book)}">
                        <h3>${escapeHtml(bookTitle)}</h3>
                        <button type="button" aria-expanded="false">Expand</button>
                    </div>
                    <div class="book-content hidden">
                        ${subtitleHtml}
                        ${sermonsHtml}
                    </div>
                </div>`;
        }).join('');

        // Cache rows for edit lookups
        window._sermonRows = rows;
    }

    // ── Edit ──────────────────────────────────────────────────────────────────
    function startEdit(id) {
        const rows = window._sermonRows || [];
        const sermon = rows.find(r => String(r.id) === String(id));
        if (!sermon) { showStatus('Sermon not found.', 'error'); return; }

        bookSelect.value = sermon.book_slug;
        updateBookInputVisibility();
        document.getElementById('subtitle').value = sermon.book_subtitle || '';
        document.getElementById('title').value    = sermon.title;
        document.getElementById('passage').value  = sermon.passage || '';
        document.getElementById('date').value     = sermon.date    || '';
        document.getElementById('url').value      = sermon.url;
        sermonIdInput.value = sermon.id;
        cancelEditBtn.style.display = 'inline-flex';
        showStatus(`Editing "${sermon.title}". Make changes and click Save sermon.`, 'success');
        adminForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ── Delete ────────────────────────────────────────────────────────────────
    async function deleteSermon(id) {
        if (!confirm('Delete this sermon? This cannot be undone.')) return;
        hideStatus();
        const { error } = await db.from('sermons').delete().eq('id', id);
        if (error) { showStatus('Delete failed: ' + error.message, 'error'); return; }
        showStatus('Sermon deleted successfully.');
        resetForm();
        await loadSermons();
    }

    // ── Save (insert / update) ────────────────────────────────────────────────
    adminForm.addEventListener('submit', async e => {
        e.preventDefault();
        hideStatus();

        const bookValue   = bookSelect.value;
        const bookSlug    = bookValue === '__new__' ? newBookInput.value.trim() : bookValue;
        const subtitle    = document.getElementById('subtitle').value.trim() || null;
        const title       = document.getElementById('title').value.trim();
        const passage     = document.getElementById('passage').value.trim() || '';
        const date        = document.getElementById('date').value || null;
        const url         = document.getElementById('url').value.trim();
        const editId      = sermonIdInput.value;

        if (!bookSlug || !title || !url) {
            showStatus('Book slug, sermon title, and URL are required.', 'error');
            return;
        }

        const payload = { book_slug: bookSlug, book_subtitle: subtitle, passage, title, url, date };

        let error;
        if (editId) {
            ({ error } = await db.from('sermons').update(payload).eq('id', editId));
        } else {
            ({ error } = await db.from('sermons').insert(payload));
        }

        if (error) { showStatus('Save failed: ' + error.message, 'error'); return; }
        showStatus(editId ? 'Sermon updated successfully.' : 'Sermon added successfully.');
        resetForm();
        await loadSermons();
    });

    cancelEditBtn.addEventListener('click', () => { hideStatus(); resetForm(); });
    bookSelect.addEventListener('change', updateBookInputVisibility);

    // ── Sermon list click delegation ──────────────────────────────────────────
    sermonsContainer.addEventListener('click', e => {
        // Toggle book expand/collapse
        const header = e.target.closest('.book-header');
        if (header) {
            const content  = header.nextElementSibling;
            const toggle   = header.querySelector('button');
            if (!content) return;
            content.classList.toggle('hidden');
            if (toggle) {
                const hidden = content.classList.contains('hidden');
                toggle.textContent = hidden ? 'Expand' : 'Collapse';
                toggle.setAttribute('aria-expanded', String(!hidden));
            }
            return;
        }

        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        const id     = btn.dataset.id;
        if (action === 'edit')   startEdit(id);
        if (action === 'delete') deleteSermon(id);
    });

    // ── Boot ──────────────────────────────────────────────────────────────────
    checkSession();
</script>
</body>
</html>
