name: Backup sermon data

on:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: write

concurrency:
  group: monthly-sermon-data-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Save monthly backup
        run: |
          backup_file="backups/sermons-data-$(date -u +%Y-%m).json"
          if [ -f "$backup_file" ]; then
            echo "Monthly sermon data backup already exists."
            exit 0
          fi

          mkdir -p backups
          cp sermons-data.json "$backup_file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$backup_file"
          git commit -m "Back up sermon data for $(date -u +%Y-%m)"
          git push
